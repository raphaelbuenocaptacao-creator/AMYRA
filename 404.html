<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070914">
<meta name="robots" content="noindex">
<title>AMYRA — Redirecionando</title>
<style>
html,body{margin:0;min-height:100%;background:#050711;color:#f7f8ff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}body{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box;background:radial-gradient(circle at 50% 35%,rgba(143,124,255,.2),transparent 28%),linear-gradient(180deg,#050711,#0a0d19)}.orb{width:104px;height:104px;margin:0 auto 28px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff 0 4%,#aaf0ff 12%,#8f7cff 42%,rgba(143,124,255,.08) 72%);box-shadow:0 0 55px rgba(100,216,255,.28),0 0 110px rgba(143,124,255,.25);animation:pulse 5s ease-in-out infinite}.brand{font-weight:950;letter-spacing:.26em;font-size:14px}.muted{color:#aab3d2;line-height:1.6;max-width:520px}.btn{display:inline-block;margin-top:18px;padding:14px 18px;border-radius:18px;text-decoration:none;font-weight:850;color:#081018;background:linear-gradient(135deg,#b9f4ff,#8f7cff 65%,#ff9fde)}@keyframes pulse{50%{transform:scale(1.08)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<script>
(function(){
  var path=location.pathname.replace(/\/+$/,'');
  var base='/AMYRA';
  var known={
    '/AMYRA/plans':'/AMYRA/plans/',
    '/AMYRA/plans.html':'/AMYRA/plans/',
    '/AMYRA/safety':'/AMYRA/safety.html'
  };
  var target=known[path];
  if(target){location.replace(target+location.search+location.hash);return;}
  setTimeout(function(){location.replace(base+'/'+location.search+location.hash)},1800);
})();
</script>
</head>

</html>
