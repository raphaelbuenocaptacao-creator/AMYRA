name: Apply isolated PWA lifecycle patch

on:
  push:
    branches: ['automation/pwa-update-lifecycle']

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/pwa-update-lifecycle
      - name: Patch service worker registration lifecycle
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          old = "boot();if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(()=>{}));"
          new = """boot();if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))window.addEventListener('load',async()=>{try{const hadController=Boolean(navigator.serviceWorker.controller),registration=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});let reloading=false;const updateRegistration=()=>registration.update().catch(()=>{});updateRegistration();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')updateRegistration()});window.addEventListener('online',updateRegistration);navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadController&&!reloading){reloading=true;location.reload()}})}catch(_){}});"""
          if new in text:
              raise SystemExit(0)
          if old not in text:
              raise SystemExit('expected registration block not found')
          p.write_text(text.replace(old, new, 1))
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'fix: refresh PWA service worker safely'
          git push origin HEAD:automation/pwa-update-lifecycle
